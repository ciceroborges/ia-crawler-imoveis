version: "3.7"

services:
  app:
    build:
      args:
        user: dev
        uid: 1000
      context: ./
      dockerfile: ./docker/DockerFile
    image: ia-crawler-imoveis-app
    container_name: ia-crawler-imoveis-app
    restart: unless-stopped
    ports:
      - 9000:9000
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - ia-crawler-imoveis
  
  mysql:
    image: mariadb:latest
    container_name: ia-crawler-imoveis-db
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - ./docker/db/data:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d
    networks:
      - ia-crawler-imoveis
    
  nginx:
    image: nginx:latest
    container_name: ia-crawler-imoveis-nginx
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./:/var/www
      - ./docker/conf:/etc/nginx/conf.d
    networks:
      - ia-crawler-imoveis
  
networks:
  ia-crawler-imoveis:
    driver: bridge